<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — RetailIQ Copilot</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-badge">
          <span>⚡ NexusTiQ24 • PS03</span>
        </div>
        <h1 class="auth-title">RetailIQ</h1>
        <p class="auth-subtitle">Sales & Inventory Copilot</p>
      </div>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category if category != 'error' else 'danger' }}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="/login" method="POST" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Store Manager Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="manager@retailiq.internal" 
            required 
            autocomplete="email"
            value="{{ default_email or '' }}"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;" id="btnLogin">
          <span>Sign In to Dashboard</span>
          <span>→</span>
        </button>
      </form>

      <div class="auth-divider">Or for Hackathon Evaluation</div>

      <!-- 1-Click Demo Shortcut Login for Judges -->
      <form action="/login" method="POST">
        <input type="hidden" name="email" value="manager@retailiq.internal">
        <input type="hidden" name="password" value="RetailIQ2026!">
        <button type="submit" class="btn btn-secondary" style="width: 100%; padding: 11px;" id="btnDemoLogin">
          <span>🚀 1-Click Demo Manager Login</span>
        </button>
      </form>

      <div class="auth-footer">
        <span>Don't have an account? </span>
        <a href="/register" style="font-weight: 600; color: #a5b4fc;" id="linkRegister">Create account</a>
      </div>
    </div>
  </div>
</body>
</html>
